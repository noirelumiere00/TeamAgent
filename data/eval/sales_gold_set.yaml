  # ==========================================
  # 4. ネガティブケース (hallucination 防止、該当無しが正解)
  # ==========================================
  - id: 23
    query: "東芝の半導体事業の提案について"
    expect_keywords: []
    expect_zero_hits: true
    notes: "DB に無いはず。Bot は「資料に記載がありません」と返すべき"

  - id: 24
    query: "2027 年 4 月のキャンペーン計画"
    expect_keywords: []
    expect_zero_hits: true
    notes: "未来の架空イベント、hallucinate しないか"

  - id: 25
    query: "TeamAgent Bot 自身の開発履歴"
    expect_keywords: []
    expect_zero_hits: true
    notes: "メタ質問、検索対象外"

  # ==========================================
  # 5. [v2] deal_phase 取り違え対策 (Day 9 miss 類型①)
  #    同一クライアントで複数フェーズが混在するとき、正しいフェーズを引けるか
  # ==========================================
  - id: 26
    query: "日本ガイシのリクルーティング案件はどうなってる"
    expect_keywords: ["日本ガイシ"]
    expect_client_name: "日本ガイシ"
    notes: "ケイパ案件と混同せずリクルーティング側を引けるか (Day9 case1 の取り違え対策)"

  - id: 27
