    expect_keywords: ["薬事"]
    notes: "化粧品/医薬品系の規制論点"

  - id: 20
    query: "リクルーティング目的の提案で成功したケース"
    expect_keywords: ["リクルーティング"]

  # ==========================================
  # 3. Drive 資料系 (PDF / フォルダ取り込み結果評価)
  # ==========================================
  - id: 21
