  # ==========================================
  - id: 30
    query: "BANT C の検討止まり案件を一覧で"
    expect_keywords: []
    expect_metadata:
      bant_score: "C"
    notes: "集約モード。LIKE '%C%' 列挙 (bant_score は 'C（検討）' 形式)"

  - id: 31
    query: "これまでの提案案件を全部リストアップして"
    expect_keywords: []
    notes: "全件集約。aggregation mode が件数列挙で答えるべき (要約に流れない)"

  - id: 32
    query: "代理店経由の案件は全体で何件くらいある"
    expect_metadata:
      channel_type: "代理店"
    notes: "件数・傾向系。channel_type メタ列挙"

  - id: 33
    query: "BtoC 飲料系で提案したクライアントの傾向"
    expect_keywords: []
    notes: "業界横断の傾向抽出。単一 chunk でなく複数を束ねる"

  - id: 34
    query: "ケイパ提案で繰り返し出てくる勝ち筋は"
    expect_metadata:
      deal_phase: "ケイパ"
    notes: "横断パターン抽出。v2 prompt の actionable thinking 評価"

