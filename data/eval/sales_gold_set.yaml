  # 7. [v2] 固有クライアント追加 (実在 FB の取りこぼし確認)
  # ==========================================
  - id: 35
    query: "伊藤園の提案フィードバック"
    expect_keywords: ["伊藤園"]
    expect_source_type: "slack"

  - id: 36
