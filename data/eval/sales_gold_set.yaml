  # ==========================================
  # 4. ネガティブケース (hallucination 防止、該当無しが正解)
  # ==========================================
  - id: 23
    query: "東芝の半導体事業の提案について"
    expect_keywords: []
    expect_zero_hits: true
    notes: "DB に無いはず。Bot は「資料に記載がありません」と返すべき"

  - id: 24
