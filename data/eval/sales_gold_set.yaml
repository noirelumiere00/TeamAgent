# TeamAgent 検索精度評価 Gold Set v1
#
# 目的:
#   Sprint 4 で実装した機能 (Cohere Rerank, FB Drive Match, prompt v2 等) の
#   検索精度を **数値で計測** する。1 事例の anecdote (例: 日本ガイシ rank 6→1) に
#   依存せず、25 ケースの平均で改善を検証する。
#
# 評価指標:
#   - **top1_hit**: 期待 chunk が top-1 にあるか (0 or 1)
#   - **top5_hit**: top-5 に含まれるか
#   - **mrr**: 1 / (期待 chunk の rank)、含まれなければ 0
#   - **precision@5**: top-5 中の関連 chunk 比率
#   - **cost_usd / latency_ms**: 横軸として記録
#
# 期待 chunk マッチ判定:
#   - `expect_keywords`: chunk の content に **すべて** 含まれていれば match
#   - `expect_source_type`: optional、source_type が一致しているか
#   - `expect_client_name`: optional、metadata.client_name に部分一致
#   - `expect_metadata`: optional、metadata の他フィールドへの追加条件
#
# 作成方針:
#   - 1〜10: Day 8 で実機検証済の Slack FB 案件 (確実に DB にある)
#   - 11〜20: BtoB / BtoC / 業界別の汎用クエリ (パターン抽出評価)
#   - 21〜25: ネガティブケース (該当無しが正解、hallucination 防止)
#   - 26〜50 [v2 拡張, 2026-06-01]: Day 9 で判明した 52% 天井の miss 類型を狙撃:
#       26〜29: deal_phase 取り違え (同一クライアント複数フェーズの弁別)
#       30〜34: 集約・横断クエリ (一覧/傾向/全般 → aggregation mode)
#       35〜39: 固有クライアント追加 (実在 FB の取りこぼし)
#       40〜44: 訴求・論点パターン (positive/negative_reaction 横断抽出)
#       45〜46: Drive 資料系 (gdrive source_type 切り分け)
#       47〜50: ネガティブ追加 (hallucination 防止強化、雑談弾き)

version: 2
description: "検索精度 評価セット v2 (50 ケース)。v1=Day8 baseline 25 + v2=Day10 miss類型狙撃 25"

cases:
  # ==========================================
  # 1. Day 8 実機検証済の固有案件 (確実にヒットすべき)
  # ==========================================
  - id: 1
    query: "日本ガイシのケイパ提案について教えて"
    expect_keywords: ["日本ガイシ", "ADK中部", "ケイパ"]
    expect_source_type: "slack"
    expect_client_name: "日本ガイシ"
    notes: "Day 8 動作確認で dense rank 6 → Rerank rank 1 を実証した代表ケース"

  - id: 2
    query: "マンダムのヒアリング案件の温度感を教えて"
    expect_keywords: ["マンダム", "ヒアリング"]
    expect_source_type: "slack"
    expect_client_name: "マンダム"

  - id: 3
    query: "ニチレイの1回目提案フィードバック"
    expect_keywords: ["ニチレイ"]
    expect_source_type: "slack"

  - id: 4
    query: "ADK中部 BtoBリクルーティング案件"
    expect_keywords: ["ADK中部", "リクルーティング"]
    expect_source_type: "slack"

  - id: 5
    query: "アサヒビールのケイパ提案"
    expect_keywords: ["アサヒビール", "ケイパ"]
    expect_source_type: "slack"

  - id: 6
    query: "電通キリン案件の商談感触"
    expect_keywords: ["電通", "キリン"]

  - id: 7
    query: "PPIHのケイパ提案フィードバック"
    expect_keywords: ["PPIH"]
    expect_source_type: "slack"

  - id: 8
    query: "サントリーのケイパ提案"
    expect_keywords: ["サントリー", "ケイパ"]
    expect_source_type: "slack"

  - id: 9
    query: "クラシエのケイパ提案"
    expect_keywords: ["クラシエ", "ケイパ"]
    expect_source_type: "slack"

  - id: 10
    query: "ユニーの2回目提案"
    expect_keywords: ["ユニー", "2回目以降提案"]
    expect_source_type: "slack"

  # ==========================================
  # 2. 業界別パターン抽出 (汎用クエリ、prompt v2 効果評価)
  # ==========================================
  - id: 11
    query: "BtoB企業のケイパ提案で過去刺さった訴求は？"
    expect_keywords: ["BtoB"]
    expect_metadata:
      deal_phase: "ケイパ"
    notes: "v2 prompt で「展示会活用 / 先行者利益 / 既存資産再活用」抽出を期待"

  - id: 12
    query: "飲料メーカー向けの提案実績"
    expect_keywords: ["伊藤園", "アサヒ", "サントリー", "キリン"]  # いずれか
    notes: "OR マッチ (expect_keywords_any) は将来拡張、v1 では先頭でも OK"

  - id: 13
    query: "UGCのTTOで成功した事例"
    expect_keywords: ["UGC"]

  - id: 14
    query: "失注した案件と失注理由"
    expect_keywords: []
    expect_metadata:
      bant_score: "C"  # C 評価 = 検討止まりに近い
    notes: "BANT C 案件のレビュー、推奨アクション抽出を期待"

  - id: 15
    query: "BANT A の前向きな案件一覧"
    expect_keywords: []
    expect_metadata:
      bant_score: "A"

  - id: 16
