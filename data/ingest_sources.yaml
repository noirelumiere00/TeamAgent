# ============================================================
# TeamAgent — 取り込み対象データソース宣言
# ============================================================
# このファイルで「どの Slack チャネル / Drive フォルダ / Sheet を取り込むか」を
# 宣言的に管理。ingest パイプラインが起動時に読んで、各 adapter にディスパッチする。
#
# Sprint 3 でユーザーから提供された貴重情報源を反映（2026-05-26）。
# 機密扱い：このファイル自体はコミットして OK だが、ACL 設計は acl_emails 経由で
# 必ず制限すること。public channel でも全営業に見せない方針なら、明示的に絞る。
# ============================================================

version: 1

slack_channels:
  # ---- 提案ナレッジ ----
  # channel_id を slack_search_channels で確認済 (2026-05-27)
  - channel_id: "C091ZSVTKF1"
    channel_name: "#proj-ナレッジ共有"
    description: |
      提案時の情報や資料を共有するチャネル。スレッドに提案の経緯、メンバー間の
      ディスカッション、Drive へのリンクが含まれる。
    include_files: true       # 添付された PDF も取り込み対象
    oldest_days: 180          # 直近半年（過去ナレッジも価値あり）
    extra_metadata:
      topic: "提案ナレッジ"
      use_case: "RAG 検索の主要情報源"

  # ---- ショート動画営業 FB（最重要）----
  # channel_id を slack_search_channels で確認済 (2026-05-27)
  - channel_id: "C0A1207GYHZ"
    channel_name: "#proj-ショート動画_営業フィードバック情報"
    description: |
      商談 FB・クライアント温度感が大量にあるチャネル。
      ユーザー曰く「貴重な情報源、DB にしたい」（2026-05-26）。
    include_files: true
    oldest_days: 365          # 過去 1 年（温度感の経時変化を保持）
    extra_metadata:
      topic: "営業 FB"
      use_case: "顧客温度感・案件温度感の蓄積"
      priority: "high"        # 取り込み優先度

gdrive_folders:
  # ---- ナレッジ共有 Drive フォルダ ----
  - folder_id: "12FMLe9XG24wlPrBCHOQ_vcr4uELtMN1E"
    folder_name: "ナレッジ共有 - 添付ファイル"
    description: "#proj-ナレッジ共有 で共有された添付資料の保管先"
    include_subfolders: true
    mime_type_filter: null    # PDF / Doc / Sheet すべて
    extra_metadata:
      topic: "提案ナレッジ"
      source_chain: "slack -> drive"  # Slack → Drive の関係性

  # ---- ショート動画資料全般 (Day 7 = 2026-05-27 追加、最重要) ----
  # 営業との合意で「命名ルール付きで全資料をここに集約」する運用に決定。
  # 共有ドライブ作戦 (共有ドライブにアップ義務化) は機能しなかったため、
  # 営業の Drive 内に置いた特定フォルダを「ナレッジ集約場所」にする方針に切替。
  - folder_id: "14Wfp6GVCwaJROGhmEbd-r4_CfUymjwDL"
    folder_name: "ショート動画資料全般"
    description: |
      営業と命名ルール合意済の主要ナレッジ集約フォルダ。
      ショート動画関連の提案書 / 議事録 / 価格表 / クライアント FB が集まる想定。
    include_subfolders: true
    mime_type_filter: null    # PDF / Doc / Sheet すべて
    extra_metadata:
      topic: "ショート動画 主要ナレッジ"
      use_case: "営業 RAG 検索の主要情報源"
      priority: "high"

  # ============================================================
  # ルールブック再編フォルダ（01〜08）について — 個別エントリは**意図的に書かない**
  # ============================================================
  # 2026-07-15 に実 Drive / 実コードで計測し、「01〜06 を個別に取り込む」計画は
  # 不要かつ有害と確定したためプレースホルダ 6 エントリを撤去した。根拠:
  #
  #  1. 増えない: 01〜08 は上の "ショート動画資料全般"(14Wfp6…) の直下にあり、
  #     include_subfolders: true の再帰 walk が既にカバーしている（打ち切りは
  #     DEFAULT_WALK_MAX_FILES=5000・観測は truncated_walk_roots ログ）。個別
  #     エントリを足しても取り込み対象は増えない。
  #  2. 二重カバーは有害: 同一 file は external_id=file.id で 1 行に UPSERT されるが、
  #     ON CONFLICT DO UPDATE は metadata = EXCLUDED.metadata の **全置換**
  #     (repository._upsert_document)。しかも spec.folder_name は classify の Haiku
  #     プロンプト（格納フォルダ行）に入る **live な分類入力** なので、二重カバー時は
  #     「yaml で後に書いた spec の分類が勝つ」last-write-wins になり、**並び順を
  #     変えるだけで cls_doc_type / cls_project ＝ /app の 資料種別・業種 タグが
  #     黙って変わる**。このブロックの順序を触るときは必ずこれを意識すること。
  #  3. 価値が無い: extra_metadata(rulebook_category 等) は export_vault の SELECT が
  #     キー allowlist（cls_* / knowledge_kind / client_type / proposed_menu /
  #     client_name）のため /app のタグには到達しない。DB には載るが読み手ゼロ。
  #     タグ軸にしたいなら export_vault の SELECT + render_doc_note +
  #     build_app_html の front()/docTags を同時に配線する必要がある。
  #
  # 99_一次倉庫（直接アップロード用の一時置き場。GAS が本番フォルダへ移動してから
  # 記録するので恒久的な置き場ではない）は gdrive_exclude_folder_name_re の既定
  # (^\s*99[_＿]|一次倉庫|検索対象外) で walk 側から除外済み。

gsheets:
  # ---- ナレッジ共有フォーム回答 ----
  - sheet_id: "1jRmoUPo0kAhOGA6secGcwGHILH5LHt7lYvEuxJ5uupo"
    sheet_name: "ナレッジ共有 - フォーム回答"
    description: |
      ナレッジ共有チャネルに紐づく Google Form の回答スプレッドシート。
      行単位で 1 ナレッジ。column は質問項目（業界 / 商材 / 提案結果 等）。
    tabs:
      - gid: 278789217
        tab_name: "フォーム回答 1"
      # ⚠️ 「ファイル記録」タブ (gid 1962561294・1 ファイル 1 行・342 行) は **足さない**
      # （2026-07-15 実測で「便益ゼロ・リスク甚大」と確定）:
      #  1. 新タグ(カテゴリ/クライアント種別/提案プロダクト)の原料は上のフォーム回答タブに
      #     全て揃っている（資料の概要_メイン / クライアント種別 / 提案プロダクト を実測確認）。
      #  2. ファイル記録は 1 ファイル 1 行だが、知見(社名/案件名/種別/ポイント/なぜ)は **投稿単位**
      #     なので兄弟行の本文がほぼ同一になる。本番は DOC_DEDUP_DETECT=true（Jaccard 既定 0.7・
      #     ingest_schedule.tf）で、実測 Jaccard=0.8088 → 兄弟は suppressed され export_vault が
      #     落とす。残るのは連番ユニーク≒230 件 ≒ 237 投稿＝**フォーム回答と実質同じ**。
      #  3. 一方でこのタブは連番を持つため安定 ID を入れると、連番だけ持ち枝番を持たない
      #     フォーム回答タブ(実測 234/237 が連番あり)まで external_id 形式が変わり、gsheets に
      #     stale 検出が無いため **既存 doc が永久孤児化＋全行が重複索引化** する。
      # ＝ per-file 粒度は dedup で消えるのに、孤児化リスクだけを買うことになる。
    row_unit: true            # 1 行 = 1 document として取り込み
    extra_metadata:
      topic: "提案ナレッジ"
      structure: "form-response"

  # ---- ショート動画営業 FB フォーム回答（最重要）----
  - sheet_id: "1VukC1Qv0MRqxSvgxuSqDwzpPsM_K1FJNTpTXs10KQhY"
    sheet_name: "ショート動画営業 FB - フォーム回答"
    description: |
      営業 FB のフォーム回答。クライアント温度感・案件温度感が高頻度で更新される。
      ユーザー曰く「DB にしたい」最重要情報源（2026-05-26）。
    tabs:
      - gid: 537831563
        tab_name: "フォーム回答 1"
    row_unit: true
    extra_metadata:
      topic: "営業 FB"
      priority: "high"
      structure: "form-response"
      use_case: "顧客温度感の経時追跡 + 検索"

  # ---- 📍ショート動画施策事例集（マスター表）2026-09-11 追加・B-10 ----
  # アポ前 事例ブリーフィング（pre_meeting_brief）が引く **唯一の母集団**。
  #
  # ⚠️ sheet_id は 2026-09-11 時点で未確定（ユーザーが Drive 上で探索中）。実 ID が
  # 分かるまで yaml にはプレースホルダを置き、実運用では env で後入れする。
  # **2 つとも必須**（どちらか欠けるとこのエントリは読み込まれない）:
  #     CASE_CORPUS_SHEET_ID=<spreadsheet id>
  #     CASE_CORPUS_SHEET_GID=<マスター表タブの gid>
  # GID を必須にしているのは、typo（例「#gid=123」を貼る）のときに下の gid: 0 へ
  # 黙って fallback すると、マスター表ではない先頭タブが case_corpus として丸ごと
  # 取り込まれ事例として朝の DM に出るため（loader は非数値なら error + タブ skip）。
  # env 未設定のときは loader が ingest_sources_skip_unconfigured_env を出して
  # **この 1 エントリだけ**を落とす（既定の skip_placeholder=True・本番
  # scripts/ingest_sources.py が使う経路）。slack/gdrive/既存 gsheets の取り込みは
  # 一切変わらない。なお strict mode（tests 専用の検査モード）では raise する
  # ＝貼り忘れプレースホルダの検知に穴を開けない。
  #
  # ⚠️ CASE_CORPUS_SHEET_ID に **既存エントリと同じ sheet_id** を貼ってはいけない。
  # external_id = sheet_id:gid:row_idx なので完全衝突し、documents の
  # ON CONFLICT DO UPDATE（metadata 全置換）で既存 document の cls_doc_type /
  # cls_project が spec の並び順だけで黙って書き換わる。loader は重複 sheet_id を
  # 検知したら ingest_sources_duplicate_sheet_id を error 出力して **当該エントリを
  # 採用しない**（既存が勝つ）が、貼る前に必ず別シートであることを確認すること。
  #
  # ⚠️ 事例の「取り下げ」は **行削除ではなく対外利用可否セルを NG にする**（行は消さない）。
  # gsheets には stale 検出が無く（上のファイル記録タブの注記 3 と同じ理由）、
  # external_id が行番号ベースなので:
  #   - 行を消しても既存 document は残り、翌朝の DM に載り続ける
  #   - 行を空にしても pipeline は空行を skip するので古い doc が更新されない
  #   - 行の挿入・削除で全行の external_id がずれ、sticky（前回の ng）が別の事例へ付き替わる
  # ＝ セルを NG にするのが唯一の確実な取り下げ手段（B-9 の受入条件に含める）。
  #
  # ⚠️ 事例 pptx フォルダ（「20260708_各社成功事例集★クライアント展開NG」「03｜事例」）は
  # **ここに足さない**。Drive のファイルは複数フォルダから辿れるため、NG フォルダと通常
  # フォルダの双方に属する 1 ファイルは external_id=file.id の UPSERT
  # （metadata = EXCLUDED.metadata の全置換）で後勝ちになり、NG 印が黙って消える。
  # v1 の対外利用可否の真実源はこのマスター表の列だけ（計画 §4 論点 2 の推奨 B）。
  # pptx フォルダ取込は C-11（Drive parents 実測 + 2 spec 跨ぎ 0 件の確認が前提）。
  #
  # ⚠️ 母集団の選択はユーザー裁定待ち（2026-09-11）。実見メモ
  # Artifacts/aico-inputs-20260911/case_corpus_columns_20260911.md は「専用の事例集
  # スプレッドシートは不要。取り込み済みのナレッジ共有フォーム回答（上の 1 件目）が
  # そのまま母集団に使える」と結論しており、本エントリと正面衝突している。
  # メモ案を採る場合は **このエントリを消して上の 1 件目に case_corpus を足す**
  # （同一 sheet_id の 2 重エントリにしない＝上の重複 sheet_id 注記のとおり）。
  - sheet_id: "REPLACE_WITH_CASE_CORPUS_SHEET_ID"
    sheet_id_env: "CASE_CORPUS_SHEET_ID"
    sheet_name: "📍ショート動画施策事例集"
    description: |
      ショート動画施策の実施事例マスター表。列は カテゴリ / 企業名 / 商材 / 効果 /
      営業担当（＋「対外利用可否」列は追加を検討中）。1 行 = 1 事例 = 1 document。
      アポ前 事例ブリーフィングが「相手企業 → 実施事例」を引くときの母集団。
    tabs:
      - gid: 0
        gid_env: "CASE_CORPUS_SHEET_GID"
        tab_name: "マスター表"
    row_unit: true
    extra_metadata:
      # この 1 行が母集団の定義。pipeline はこのフラグでしか事例集経路に入らないので、
      # 上 2 シートには構造的に副作用が無い（cls_doc_type / cls_project は不変）。
      case_corpus: "true"
      topic: "ショート動画施策事例集"
      structure: "case-master-table"
      use_case: "アポ前 事例ブリーフィングの事例引き当て"

# ============================================================
# 共有ドライブ全自動 crawl (Day 7 = 2026-05-27 追加)
# ============================================================
# s-komata がメンバーになっている全共有ドライブを再帰 walk し、
# 営業資料として価値ありそうなものだけ取り込む。
# - sales_relevance_filter=true: mime_type whitelist + ノイズ除外 + 更新日制限
# - max_files_per_drive: 1 ドライブあたりの安全上限
# - modified_within_days: 過去 N 日以内に更新されたファイルのみ（古い案件除外）
shared_drives_crawl:
  # 2026-08-17 ユーザー裁定: 全共有ドライブ横断は停止する。
  # ナレッジの実体（01_提案〜08_AI活用）は gdrive_folders の
  # 「ショート動画資料全般」(14Wfp6…) 配下として既にカバー済みで、
  # 横断クロールの実収穫は経費・HP更新・社内ポータル等のノイズが主だった
  # （08-17 DB 実測: 経費 606 件・HP 237・ポータル 206・SBI 108 など）。
  # 巨大共有ドライブ「ドライブ」(0AG3odbqoCwM8) の全量取り込み案もこの裁定で撤回。
  enabled: false
  name_filter: []                  # 空: 全共有ドライブ。["営業", "ナレッジ"] で絞れる
  sales_relevance_filter: true     # PDF/Doc/Sheet/Slide + ノイズ除外
  # 2026-08-14: 3000 では対象共有ドライブ（1139 フォルダ・3000+ ファイル）の初回
  # 走査が必ず上限打ち切り→fail-closed で 1 件も入らないと実測。窓を 1 年へ絞りつつ
  # 上限へ余裕を持たせ、初回全量走査を完走させる（完走後は changes API の増分が主経路）。
  # 2026-08-17: 12000 でも共有ドライブ「ドライブ」(0AG3odbqoCwM8・4195 フォルダ・
  # 12000+ ファイル) が打ち切りと実測（08-14 の 2 run とも）。カバー裁定に基づき増枠。
  # 上限到達 drive は raise でなく skip + walk_truncated warning になる（同日修正）。
  max_files_per_drive: 30000
  modified_within_days: 365        # 1 年以内（null で全期間）
  extra_metadata:
    topic: "共有ドライブ横断クロール"
    use_case: "営業 RAG 検索の網羅性"

# ============================================================
# ルールブック運用のグローバル設定
# ============================================================
# gdrive_rulebook_root_folder_id: ナレッジ/ ルートの folder_id。
#
# ⚠️⚠️ **実 ID を貼らないこと**（placeholder のままが現時点の正しい状態）。
# 2026-07-15 実測: preflight (_check_rulebook_root) の不足判定は
#     if folder.id not in yaml_folder_ids
# で、**親フォルダの include_subfolders による再帰カバレッジを見ない**。実ルート
# (14Wfp6…) を貼ると、既に再帰 walk で取り込めている 01〜08 の 8 フォルダが全て
# 「未登録」と誤検知され _fail → SystemExit(1) になる。さらに、この検査は
#   - slack の処理より **前** に走る（pipeline の kind ループ順）
#   - 呼び出し側 scripts/ingest_sources.py に try/except が無い
#   - 実行は SOURCES="slack,gdrive,gsheets" の**単一プロセス**（run_ingest_task.sh 既定）
# のため、**gdrive の設定ミスだけで slack / gsheets ごと ingest が全断**する。
#
# 有効化するには yaml ではなく**コード修正が前提**:
#   (1) 不足判定に「親の再帰カバレッジ」を考慮させる
#   (2) fail-close を gdrive kind 内に封じ込め、他ソースを巻き添えにしない
# それまでは placeholder のまま = preflight 無効（未設定と同じ扱い）が正。
gdrive_rulebook_root_folder_id: "REPLACE_WITH_KNOWLEDGE_ROOT"

# gdrive_exclude_folder_name_re: フォルダ名の除外 regex。gdrive_folders / 共有ドライブ
# crawl 両経路の walk に適用され、マッチしたサブフォルダは配下ごと skip される
# （skipped_folder ログで観測可能）。省略時はコード側の既定
#   ^\s*99[_＿]|一次倉庫|検索対象外
# が使われる（99_一次倉庫＝検索対象外の運用ルールをコードで保証）。
# 上書きしたい場合のみ、下の行のコメントを外して編集する:
# gdrive_exclude_folder_name_re: "^\\s*99[_＿]|一次倉庫|検索対象外"

# ============================================================
# Adapter ↔ source_type マッピング
# ============================================================
# slack_channels  → adapters/slack_channel_ingest_client.py → source_type='slack'
# gdrive_folders  → adapters/gdrive_client.py                → source_type='gdrive'
# gsheets         → adapters/gsheets_client.py (PR-5 で実装)→ source_type='other' 暫定
#                   （or migration 0003 で gsheets を ENUM に追加）

# ============================================================
# ACL 既定方針
# ============================================================
# - acl_emails: 各 source の参加者（Slack channel members / Drive permissions /
#               Sheet permissions）を ingest 時に取得して写像
# - acl_groups: Workspace group は acl_groups[]
# - 営業 16 名全員に見せていい情報なら sales@vectorinc.co.jp 等の Workspace group
#   を acl_groups に追加する設計（Sprint 4 で実装）

# ============================================================
# 取り込み頻度（Sprint 3 / 4 で EventBridge cron 化）
# ============================================================
# - Slack: 15 分に 1 回 incremental（前回 ts 以降）
# - Drive: 15 分に 1 回 changes.list で差分検知
# - Sheets: 5 分に 1 回（フォーム回答は即時取り込みが価値）
