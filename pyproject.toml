[project]
name = "teamagent"
version = "3.0.0a1"
description = "TeamAgent - Slack で動く社内 AI Agent 基盤（Anthropic Bedrock + Skill Registry / Plugin アーキ）"
authors = [
    { name = "Shogo Komata" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Python-only Bedrock orchestration ---
    # claude-agent-sdk は Bun/JS runtime を同梱するため core runtime には入れない。
    # Anthropic Bedrock の Python client で同等の bounded tool loop を実装する。
    "anthropic>=0.40.0",
    "boto3>=1.34.0",  # Bedrock 経由でも使える

    # --- データ層 / pgvector ---
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",  # マイグレーション

    # --- 外部連携: Google ---
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # --- 外部連携: Slack ---
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.33.0",
    "aiohttp>=3.14.1",  # slack-bolt socket-mode(async) が要求。extra扱いで pip install -e . に自動で入らない

    # --- ドキュメント解析 ---
    "pypdf>=6.13.3",
    "defusedxml>=0.7.1",  # PPTX テンプレ等の XML を entity 攻撃から守る (bandit B314)
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",

    # --- 動画分析（推論だけcore。取得/変換依存は media extraへ分離） ---
    "google-genai>=0.5.0",  # Gemini 2.5 Flash 用

    # --- FMT デッキのフォントサブセット（お土産資料 便1・spec_README 必要改修4） ---
    # デッキごとに woff2 サブセットを生成し data:URI で HTML へ埋め込む。
    # woff2 圧縮に brotli が必須。
    "fonttools>=4.55.0",
    "brotli>=1.1.0",

    # --- ユーティリティ ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",  # リトライ
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.0",          # data/ingest_sources.yaml パース用（Sprint 3 PR-6）

    # --- Observability ---
    # sentry-sdk: DSN 未設定なら no-op、Async/Logging integrations 同梱
    "sentry-sdk[asyncio]>=2.18.0",

    # --- Scheduler / Workflow ---
    "apscheduler>=3.10.0",  # ローカル開発用、本番は EventBridge

    # --- Web フレームワーク（Skill 管理 API 用） ---
    "fastapi>=0.115.0",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.28.0",
    "pre-commit>=4.0.0",
]
mcp = [
    # MCP SDK（外部 SaaS の MCP 化を実装するとき用）
    "mcp>=1.28.1,<2",
]
embeddings = [
    # SearchSkill の LocalE5Embedder（multilingual-e5-large）。重い(torch)ため optional。
    # MCPバックエンドのDockerは --extra embeddings で同梱（go-live実測: 欠落で起動crash）。
    # torch を直接依存にして [tool.uv.sources] の CPU index pin を効かせる（推移的依存には効かない）。
    "sentence-transformers>=3.0.0",
    "torch>=2.13.0",
]
media = [
    # teamagent-media-worker 専用。core imageには導入しない。
    # Python/Node の Playwright は Docker/JS lock と同じ厳密版に固定する。
    "yt-dlp==2026.7.4",
    "curl-cffi==0.15.0",
    "playwright==1.60.0",
    "python-pptx==1.0.2",
    "pillow==12.3.0",
    "weasyprint>=69.0",
]

# media imageはproject本体のcore依存を解決せず、このgroupだけをlockから導入する。
# optional extraと内容を重ねるのは、利用者向け `teamagent[media]` と最小worker buildを
# 同じuv.lockで両立させるため。tests/infra が版の一致を固定する。
[dependency-groups]
dev = [
    "types-defusedxml>=0.7.0.20260504",
]
media-runtime = [
    "pydantic>=2.9.0",
    "yt-dlp==2026.7.4",
    "curl-cffi==0.15.0",
    "playwright==1.60.0",
    "python-pptx==1.0.2",
    "pillow==12.3.0",
    "weasyprint>=69.0",
]

[project.scripts]
teamagent = "teamagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# torch は Linux では CPU 版に固定（既定の PyPI は arm64/Linux でも CUDA 依存
# nvidia-* を数GB引き込み、MCPイメージが10GB級になるため）。mac/開発環境は PyPI のまま。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/teamagent"]

# ============================================================
# Tooling
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "RUF",          # ruff-specific
]
ignore = [
    # 日本語コード混在を許容するため曖昧 unicode チェックは無効化
    "RUF001",  # 文字列内の曖昧 unicode（？ ！ など）
    "RUF002",  # docstring 内の曖昧 unicode
    "RUF003",  # コメント内の曖昧 unicode
    # input が組み込み関数名と衝突するが、Skill.run(input=...) の意味的可読性を優先
    "A002",
]

[tool.ruff.lint.per-file-ignores]
# テストは shadow されてもOK、長い行も許容
"tests/**/*.py" = ["E501"]
# scripts は実験的なため、未使用 import や print も許容
"scripts/**/*.py" = ["E501", "T201"]
# HTML レポート生成は inline テンプレート文字列が長くなる（可読性のため1行維持）
"src/teamagent/skills/video_algorithm/report.py" = ["E501"]
"src/teamagent/skills/video_algorithm/slides.py" = ["E501"]
# FMT レンダラの HTML/OOXML テンプレートも同様（1宣言=1行を維持）
"src/teamagent/skills/omiyage_report/fmt/html.py" = ["E501"]
"src/teamagent/skills/omiyage_report/fmt/editable.py" = ["E501"]
"src/teamagent/skills/omiyage_report/fmt/ooxml.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# CI 環境で type stub が無いライブラリを無視する
# - sentence_transformers: ローカル開発のみ（CI ではインストールしない）
# - boto3 / aioboto3: 公式に type stub が分離されているが TeamAgent では未導入
# - pgvector: ライブラリ自体に型ヒントが無い
# - googleapiclient / google.oauth2: Sprint 3 で導入、stub なし
[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "boto3.*",
    "botocore.*",
    "pgvector.*",
    "googleapiclient.*",
    "google",
    "google.oauth2.*",
    "google_auth_oauthlib.*",
    "google.genai",
    "google.genai.*",
    "yt_dlp",
    "pypdf",
    "pypdf.*",
    "yaml",
    "openpyxl",
    "openpyxl.*",
    "docx",
    "docx.*",
    "pptx",
    "pptx.*",
    # weasyprint / playwright は重い依存で CI(--no-deps)に非導入＝import-not-found になるため
    # stub 無し扱い（遅延 import・実行時のみ必要。他の CI 非導入依存と同じ扱い）。
    "weasyprint",
    "weasyprint.*",
    "playwright",
    "playwright.*",
    # fontTools は py.typed マーカーなし（FMT デッキのフォントサブセットで使用）
    "fontTools",
    "fontTools.*",
]
ignore_missing_imports = true

# google-auth の Credentials.from_service_account_file 等は型注釈が無く strict の
# disallow_untyped_calls に引っかかる (google-auth 更新で CI 3.13 でも顕在化)。
# これらを薄くラップしている adapter ではこのチェックのみ無効化する。
[[tool.mypy.overrides]]
module = [
    "teamagent.adapters.gdrive_client",
    "teamagent.adapters.gmail_client",
    "teamagent.adapters.gsheets_client",
    "teamagent.adapters.gdocs_client",
    "teamagent.adapters.gslides_client",
    "teamagent.adapters.gcalendar_client",
    "teamagent.adapters.gpeople_client",
    "teamagent.adapters.google_auth",
    "teamagent.adapters.google_oauth_flow",
]
disallow_untyped_calls = false

# mcp(低レベル Server) の @server.list_tools()/@server.call_tool() デコレータは型注釈が
# 無く strict の disallow_untyped_decorators / disallow_untyped_calls に引っかかる。
# 境界ラッパ(mcp_gateway.server)ではこの2チェックのみ無効化する。
[[tool.mypy.overrides]]
module = [
    "teamagent.mcp_gateway.server",
]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"

# ============================================================
# import-linter: 3層分離（CLAUDE.md 6-bis）を CI で強制（spec matrix 実行基盤#27）
#   一方向: runtime → skills → adapters。下位層が上位層を import しない。
#   2026-06-16 に runtime/retry.py を adapters/retry.py へ移動し adapters→runtime 逆流を解消。
# ============================================================
[tool.importlinter]
root_package = "teamagent"

[[tool.importlinter.contracts]]
name = "adapters は最下層（runtime/skills/orchestrator/mcp_gateway/ingest を import しない）"
type = "forbidden"
source_modules = ["teamagent.adapters"]
forbidden_modules = [
    "teamagent.runtime",
    "teamagent.skills",
    "teamagent.orchestrator",
    "teamagent.mcp_gateway",
    "teamagent.ingest",
]

[[tool.importlinter.contracts]]
name = "skills は runtime を import しない（runtime → skills の一方向）"
type = "forbidden"
source_modules = ["teamagent.skills"]
forbidden_modules = ["teamagent.runtime"]
