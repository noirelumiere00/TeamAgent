name: CI

on:
  push:
    # dev を含めないと「実開発 PR（dev ベース）で CI が一切発火しない」罠になる
    # （branches フィルタは PR の base branch 基準。2026-07-10 の v0.3 監査で発覚・是正）。
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同じブランチで複数 push されたら古いランをキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + mypy + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: teamagent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teamagent_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEAMAGENT_TEST_DB_DSN: postgresql://postgres:postgres@127.0.0.1:5432/teamagent_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 重い依存は CI では skip して、テスト/lint に必要なものだけ
          pip install --no-deps -e .
          pip install \
            pydantic structlog psycopg pgvector \
            boto3 slack-sdk slack-bolt aiohttp httpx \
            anthropic \
            'mcp>=1.28.1,<2' \
            fastapi uvicorn \
            'sentry-sdk[asyncio]>=2.18.0' \
            pyyaml pypdf python-pptx pillow python-docx openpyxl \
            'fonttools[woff]>=4.63.0' \
            google-auth google-api-python-client google-auth-oauthlib \
            pytest pytest-asyncio pytest-cov mypy ruff bandit import-linter

      - name: Prepare disposable PostgreSQL test role
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["TEAMAGENT_TEST_DB_DSN"], autocommit=True) as conn:
              conn.execute(
                  """
                  DO $$
                  BEGIN
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teamagent_app') THEN
                          CREATE ROLE teamagent_app;
                      END IF;
                  END
                  $$;
                  """
              )
              conn.execute(
                  """
                  ALTER ROLE teamagent_app
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOLOGIN INHERIT
                  """
              )
              conn.execute("GRANT teamagent_app TO postgres")
          PY

      - name: Ruff (lint)
        run: ruff check src/ tests/ scripts/

      - name: Ruff (format check)
        run: ruff format --check src/ tests/ scripts/

      - name: Import layering (import-linter)
        run: lint-imports

      - name: OpenClaw config invariants
        # 設定矛盾（dmPolicy:open なのに allowFrom に "*" が無い等）を PR で fail-loud に弾く。
        # 2026-06-22 の無音 DM drop 事故の再発防止（柱1）。標準ライブラリのみで依存追加なし。
        run: python scripts/check_openclaw_config.py

      - name: Mypy (strict)
        run: mypy src/teamagent

      - name: Pytest
        run: pytest tests/ -q --cov=teamagent --cov-report=term-missing

      - name: Bandit (security scan)
        run: bandit -r src/teamagent -ll  # low+ severity 以上

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run gitleaks (CLI, no GitHub API)
        # gitleaks-action@v2 は pull_request 時に GitHub API を叩き
        # "Resource not accessible by integration"（GITHUB_TOKEN 権限）でクラッシュし、
        # かつ Node20 deprecation 警告を出す。API 非依存の公式 CLI イメージで作業ツリーを
        # 直接スキャンする（権限不要・決定的・leak 検出時は exit 1 でジョブを赤化）。
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 detect \
            --source /repo --no-git --redact --no-banner

  trivy:
    name: trivy (vuln + misconfig scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # 依存脆弱性スキャン（uv.lock / package-lock.json が対象）。
      # - CRITICAL/HIGH 検出で exit 1（ゲート）。
      # - --ignore-unfixed: 修正版が存在しない CVE で恒常赤化して CI が形骸化するのを防ぐ。
      #   修正版が出た時点で検出→依存バンプを強制する運用（例: 2026-07-10 に
      #   cryptography/starlette/yt-dlp の HIGH 5件をこの方式でバンプ済み）。
      #   ＝依存に修正版 CVE が出た瞬間、無関係な PR でも赤くなる（仕様）。その場合は
      #   依存バンプを先行 merge して rebase する。
      # - 例外は .trivyignore.yaml（paths でリソース単位スコープ＋expired_at 機械強制期限）。
      # - DB 取得は GHCR/GCR のレート制限（TOOMANYREQUESTS）対策で複数レジストリにフォールバック。
      #   image スキャン（teamagent-mcp/openclaw は E5 2.2GB 焼き込みで PR 毎 build は非現実的）は
      #   CI では行わず、ECR scan_on_push＋CodeBuild 側での定期スキャンに分離（別チケット）。
      # - action は R17 の digest pin 文化に合わせ SHA 固定（= v0.36.0）。
      - name: Trivy fs scan (依存脆弱性)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # IaC/Dockerfile の misconfig スキャン（infra/ 配下）。
      # 既存 10 件（SG egress 全開 6 件等）は .trivyignore.yaml にベースライン登録済み
      # （paths スコープ＋理由＋expired_at）。新規の CRITICAL/HIGH misconfig のみ弾く。
      - name: Trivy config scan (IaC misconfig)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true # fs スキャン step で導入済みの trivy を再利用（PATH 引き継ぎ）

  terraform:
    name: terraform lock + offline validate
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.4

      - name: Verify authoritative multi-platform provider lock
        working-directory: infra/terraform
        env:
          TF_CLI_CONFIG_FILE: /dev/null
        run: |
          unset TF_PLUGIN_CACHE_DIR
          terraform providers lock \
            -platform=darwin_arm64 \
            -platform=linux_amd64 \
            -platform=linux_arm64
          git diff --exit-code -- .terraform.lock.hcl

      - name: Build exact provider mirror without plugin cache
        working-directory: infra/terraform
        env:
          TF_CLI_CONFIG_FILE: /dev/null
        run: |
          unset TF_PLUGIN_CACHE_DIR
          rm -rf .terraform provider-mirror
          terraform providers mirror \
            -platform=linux_amd64 \
            -platform=linux_arm64 \
            provider-mirror

      - name: Reinitialize from offline mirror and validate
        working-directory: infra/terraform
        env:
          TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/ci.terraformrc
        run: |
          unset TF_PLUGIN_CACHE_DIR
          rm -rf .terraform
          terraform init -backend=false -input=false -lockfile=readonly
          required_providers="$(grep -Ec '^provider "registry\.terraform\.io/hashicorp/[a-z0-9_-]+"' .terraform.lock.hcl)"
          test "$required_providers" -gt 0
          test "$(find provider-mirror -type f -name '*_linux_amd64.zip' | wc -l)" -eq "$required_providers"
          test "$(find provider-mirror -type f -name '*_linux_arm64.zip' | wc -l)" -eq "$required_providers"
          terraform validate

  # 本番デプロイ前提のテスト（main マージ後のみ）
  smoke-test:
    name: smoke test (post-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, gitleaks, trivy]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: 報告
        run: |
          echo "✅ main マージ後の smoke test 枠"
          echo "Sprint 6 で本番 EC2 にデプロイするときに有効化"
