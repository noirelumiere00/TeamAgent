name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチで複数 push されたら古いランをキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + mypy + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 重い依存は CI では skip して、テスト/lint に必要なものだけ
          pip install --no-deps -e .
          pip install \
            pydantic structlog psycopg pgvector \
            boto3 slack-sdk slack-bolt aiohttp httpx \
            fastapi uvicorn \
            'sentry-sdk[asyncio]>=2.18.0' \
            claude-agent-sdk==0.2.87 \
            pyyaml pypdf python-pptx pillow python-docx openpyxl \
            google-auth google-api-python-client \
            pytest pytest-asyncio pytest-cov mypy ruff bandit import-linter

      - name: Ruff (lint)
        run: ruff check src/ tests/ scripts/

      - name: Ruff (format check)
        run: ruff format --check src/ tests/ scripts/

      - name: Import layering (import-linter)
        run: lint-imports

      - name: Mypy (strict)
        run: mypy src/teamagent

      - name: Pytest
        run: pytest tests/ -q --cov=teamagent --cov-report=term-missing

      - name: Bandit (security scan)
        run: bandit -r src/teamagent -ll  # low+ severity 以上

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gitleaks (CLI, no GitHub API)
        # gitleaks-action@v2 は pull_request 時に GitHub API を叩き
        # "Resource not accessible by integration"（GITHUB_TOKEN 権限）でクラッシュし、
        # かつ Node20 deprecation 警告を出す。API 非依存の公式 CLI イメージで作業ツリーを
        # 直接スキャンする（権限不要・決定的・leak 検出時は exit 1 でジョブを赤化）。
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.24.3 detect \
            --source /repo --no-git --redact --no-banner

  # 本番デプロイ前提のテスト（main マージ後のみ）
  smoke-test:
    name: smoke test (post-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, gitleaks]
    steps:
      - uses: actions/checkout@v6
      - name: 報告
        run: |
          echo "✅ main マージ後の smoke test 枠"
          echo "Sprint 6 で本番 EC2 にデプロイするときに有効化"
