# 描画 QA（render-qa）のイメージをビルドし、合成の見本デッキで「収まる版は通り、はみ出す版は捕まる」ことを確かめる。
# 手元・CI 用（本番の便には入れない・2026-10-12 小俣さん判断）。社内ネットワークでは Cloudflare Gateway が
# LibreOffice の取得を止めるため、イメージのビルドはここ（GitHub の runner）で行う。
name: render-qa

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/render-qa.yml"
      - "infra/docker/Dockerfile.teamagent-render-qa"
      - "infra/docker/Dockerfile.teamagent-render-qa.dockerignore"
      - "infra/docker/render-qa-apk.lock"
      - "infra/docker/render-qa/**"
      - "src/teamagent/media/render_qa*"
      - "src/teamagent/media/deck_qa.py"
      - "scripts/deck_render_qa.py"
      - "scripts/render_qa_smoke_decks.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: render-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build the render-qa image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f infra/docker/Dockerfile.teamagent-render-qa -t teamagent-render-qa:ci .

      - name: Make synthetic decks (inside the image, no network)
        run: |
          mkdir -p "$RUNNER_TEMP/decks"
          chmod 777 "$RUNNER_TEMP/decks"
          docker run --rm --network none \
            -v "$PWD/scripts/render_qa_smoke_decks.py:/smoke.py:ro" \
            -v "$RUNNER_TEMP/decks:/out" \
            --entrypoint python teamagent-render-qa:ci /smoke.py /out
          ls -la "$RUNNER_TEMP/decks"

      - name: Diagnose LibreOffice (isolate the startup crash)
        if: always()
        run: |
          IMG=teamagent-render-qa:ci
          D="$RUNNER_TEMP/decks"
          conv='mkdir -p /tmp/o && cd /tmp && soffice --headless --nologo --norestore --nolockcheck -env:UserInstallation=file:///tmp/lo --convert-to pdf --outdir /tmp/o /in/clean.pptx; echo exit=$?; ls /tmp/o'
          echo "== version"; docker run --rm --entrypoint soffice $IMG --version 2>&1 | tail -3 || true
          echo "== A: read-only + tmpfs + cap-drop (current)"; docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL -v "$D:/in:ro" --entrypoint sh $IMG -c "$conv" 2>&1 | tail -6 || true
          echo "== B: writable root"; docker run --rm --network none --tmpfs /tmp -v "$D:/in:ro" --entrypoint sh $IMG -c "$conv" 2>&1 | tail -6 || true
          echo "== C: as root"; docker run --rm --network none --user 0 -v "$D:/in:ro" --entrypoint sh $IMG -c "$conv" 2>&1 | tail -6 || true
          echo "== D: without our lo-profile / fontconfig (fresh HOME)"; docker run --rm --network none -e HOME=/tmp/h -e SAL_USE_VCLPLUGIN=svp -v "$D:/in:ro" --entrypoint sh $IMG -c "mkdir -p /tmp/h; $conv" 2>&1 | tail -6 || true
          echo "== E: SAL_LOG warnings (first lines)"; docker run --rm --network none -e SAL_LOG=+WARN -v "$D:/in:ro" --entrypoint sh $IMG -c "$conv" 2>&1 | grep -v '^$' | head -25 || true
          echo "== F: vanilla alpine 3.24 + libreoffice-impress only"; docker run --rm public.ecr.aws/docker/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 sh -c 'apk add -q --no-cache libreoffice-impress font-noto >/dev/null 2>&1; soffice --version; echo exit=$?' 2>&1 | tail -4 || true
          A=public.ecr.aws/docker/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          for pkgs in "libreoffice" "libreoffice-impress libreoffice-writer" "libreoffice-impress libreoffice-calc libreoffice-writer libreoffice-draw"; do
            echo "== F2: vanilla + $pkgs"; docker run --rm $A sh -c "apk add -q --no-cache $pkgs font-noto >/dev/null 2>&1; soffice --version; echo exit=\$?" 2>&1 | tail -3 || true
          done
          echo "== F3: missing shared libraries (impress only)"; docker run --rm $A sh -c 'apk add -q --no-cache libreoffice-impress >/dev/null 2>&1; for f in /usr/lib/libreoffice/program/soffice.bin /usr/lib/libreoffice/program/*.so; do ldd "$f" 2>/dev/null | grep "not found"; done | sort -u | head -20; echo done' 2>&1 | tail -22 || true
          echo "== F4: strace-free bootstrap log"; docker run --rm $A sh -c 'apk add -q --no-cache libreoffice-impress >/dev/null 2>&1; SAL_LOG="+INFO.cppuhelper+WARN" soffice --headless --version 2>&1 | grep -iE "fail|cannot|not found|error|exception" | head -15' 2>&1 | tail -16 || true
          echo "== G: our image with a clean environment (env -i)"; docker run --rm --entrypoint sh $IMG -c 'env -i HOME=/tmp PATH=/usr/bin:/bin soffice --version; echo exit=$?' 2>&1 | tail -4 || true
          echo "== H: our image env"; docker run --rm --entrypoint sh $IMG -c 'env | sort | grep -vE "^(HOSTNAME|SHLVL|PWD)="' 2>&1 | head -20 || true
          echo "== installed libreoffice packages"; docker run --rm --entrypoint sh $IMG -c 'ls /usr/lib/libreoffice/program | grep -iE "^(soffice|libmerged|libsdlo|libsdfilt|libsvx)" | head; ls /usr/lib/libreoffice/share/registry 2>/dev/null' || true

      - name: The deck that fits passes
        run: |
          python3 scripts/deck_render_qa.py "$RUNNER_TEMP/decks/clean.pptx" \
            --image teamagent-render-qa:ci --json --out "$RUNNER_TEMP/out-clean" | tee "$RUNNER_TEMP/clean.json"
          # 「確認できず（unavailable）」で素通りさせない。収まる版は ok であること。
          grep -q '"status": "ok"' "$RUNNER_TEMP/clean.json"

      - name: The deck that overflows is caught
        run: |
          set +e
          python3 scripts/deck_render_qa.py "$RUNNER_TEMP/decks/overflow.pptx" \
            --image teamagent-render-qa:ci --json --out "$RUNNER_TEMP/out-overflow" > "$RUNNER_TEMP/overflow.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/overflow.json"
          test "$code" = 1
          grep -q '"text_overflow_bottom"' "$RUNNER_TEMP/overflow.json"
