[project]
name = "aico-hermes-runtime"
version = "0.1.0"
description = "Aico DM 本人メモ v1 の Hermes 学習係ランナー（Hermes イメージ専用・TeamAgent の wheel には入らない）"
# Hermes 本体（v2026.9.21）が <3.14 のため 3.13 で動かす。ランナー自体は標準ライブラリだけで書く
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aico_hermes"]
