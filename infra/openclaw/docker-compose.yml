# TeamAgent 自律化 — OpenClaw 外殻の隔離デプロイ雛形（WS-B）
#
# 不変条件（§A 一次ソース確認に基づく / 破ってはいけない）:
#   1. openclaw-gateway は「営業データ」に絶対触れない。RDS/Secrets/KMS への IAM 権限も
#      ネットワーク到達も持たせない。creds を持つのは teamagent-mcp バックエンドだけ。
#   2. OpenClaw は単一信頼オペレータモデル＝per-user 認可はしない。RLS/本人OAuth は
#      MCP 境界の内側（teamagent-mcp）で 100% 死守する。
#   3. OpenClaw ⟷ MCP は streamable-http（私設ネットワーク mcpnet・bearer・内部のみ）。
#      stdio は使わない（親=OpenClaw が子として MCP を同居起動し隔離を壊すため）。
#
# 秘密値はこのファイルにも .env にも“値”を書かない。値は Secrets Manager / 注入された環境変数から。
# 実デプロイ（EC2 への配置・IAM 適用・トンネル）はゲート①承認＋本人操作で別途。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── 自律外殻（隔離・creds なし） ───────────────────────────────────────────
  openclaw-gateway:
    # 版pin: タグ + 不変 digest（§A: 最新 stable v2026.6.1 / min-safe >= 2026.5.26）。
    # digest は `infra/openclaw/README.md` の手順で deploy 時に再確認・更新する。
    image: ghcr.io/openclaw/openclaw:2026.6.1@sha256:b12f76a7947e4cdd328bf3ea1045d41a5494b33852c911e9bc4fdd03dde469d5
    restart: unless-stopped
    init: true # tini PID1（公式同梱）
    user: "1000:1000" # 公式イメージは非 root node(uid1000)
    read_only: true # ルートFS は read-only。書込みは下の volumes / tmpfs のみ。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # リソース上限（暴走・コスト/DoS 抑制）。compose v2 では deploy.resources も可。
    mem_limit: 2g
    pids_limit: 512
    cpus: "1.5"
    tmpfs:
      - /tmp:size=256m
    environment:
      # ★ Bedrock は IAM(aws-sdk) 認証。リージョン未指定だと us-east-1 に落ちるので必ず東京を明示。
      AWS_REGION: "ap-northeast-1"
      # ↓ 値は書かない。EC2 ならインスタンスロール、ローカル検証なら docker の --env-file 等で“参照”だけ。
      #   bedrock:InvokeModel 系のみ許可した openclaw-role を付与すること（iam/openclaw-role.policy.json）。
      # MCP バックエンド接続用 bearer（teamagent-mcp と同じ値を Secrets から注入）。
      TEAMAGENT_MCP_BEARER: "${TEAMAGENT_MCP_BEARER:?set via secret-injected env, never literal}"
      # Slack（Socket Mode）トークンも値はここに書かず注入する。
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:?inject from secret}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:?inject from secret}"
    volumes:
      # read-only rootfs 下で OpenClaw が状態を書く先（公式の3ディレクトリ）。
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      - openclaw-auth:/home/node/.config/openclaw
      # 監査・レビュー済みの設定/ペルソナを read-only で投入（perm 600 相当・Git 管理）。
      - ./openclaw.config.json5:/home/node/.openclaw/openclaw.json:ro
      - ./SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ./HEARTBEAT.md:/home/node/.openclaw/workspace/HEARTBEAT.md:ro
    command:
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "loopback" # 0.0.0.0 へは絶対に出さない。管理は SSH/Tailscale 経由。
      - "--port"
      - "18789"
    ports:
      # 管理UIはホストの loopback だけに公開（SSH ローカルフォワード前提）。P1 では外さても可。
      - "127.0.0.1:18789:18789"
    networks:
      - mcpnet # teamagent-mcp に届くためだけの私設網
      - egress # Bedrock/Slack への外向き（egress 制限は DOCKER-USER / SG で別途）
    depends_on:
      teamagent-mcp:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 信頼境界の内側：TeamAgent-MCP バックエンド（creds 保持・RLS 死守） ──────
  # creds/ネットワークを持つのはこちらだけ。OpenClaw からは mcpnet 経由でしか触れない。
  teamagent-mcp:
    # このリポジトリ(teamagent-orchestrator-poc)からビルドするイメージに差し替える。
    # （プレースホルダ。実イメージは別途 build/push し digest pin する。）
    image: "${TEAMAGENT_MCP_IMAGE:?set to a pinned teamagent backend image}"
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4096m
    pids_limit: 512
    volumes:
      - teamagent-mcp-tmp:/tmp
    command:
      - "/app/.venv/bin/python"
      - "/app/scripts/run_mcp_vertex_entrypoint.py"
    environment:
      # コンテナ内では私設網 IF に bind（mcpnet 以外からは到達不可・bearer 必須）。
      TEAMAGENT_MCP_HOST: "0.0.0.0"
      TEAMAGENT_MCP_PORT: "8787"
      TEAMAGENT_MCP_PATH: "/mcp"
      TEAMAGENT_MCP_BEARER: "${TEAMAGENT_MCP_BEARER:?inject from secret}"
      AWS_REGION: "ap-northeast-1"
      # DATABASE_URL / Google OAuth 鍵参照 / 各 Secret 名は本人の本番設定から注入。値は書かない。
      # IAM は iam/mcp-backend-role.policy.json（対象 Secret・KMS decrypt・RDS connect・L2 Bedrock）。
    networks:
      - mcpnet # OpenClaw からの内部受け口
      - data # RDS / Secrets / Bedrock への到達（SG で対象限定）
    logging: *default-logging
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=4).close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  mcpnet:
    internal: true # ★ 外部到達なしの私設網（OpenClaw⟷MCP 専用）
  egress: {}
  data: {}

volumes:
  openclaw-config: {}
  openclaw-workspace: {}
  openclaw-auth: {}
  teamagent-mcp-tmp: {}
