# OpenClaw production build integration.
#
# The S3 ZIP and its object metadata are untrusted transport.  Before any
# repository script is executed, the out-of-source trusted-release CLI must
# verify the KMS-signed publisher statement and the exact commit archive.
# The image is built/tested/scanned locally.  Only the shared promoter may
# publish a quarantine subject and atomically promote the exact subject plus
# referrers to the immutable canonical git-$SHA tag.
version: 0.2

phases:
  pre_build:
    commands:
      - test "$(uname -m)" = "aarch64"
      - TRUSTED_RELEASE_CLI=/opt/teamagent/trusted-release/bin/trusted-release
      - LOCAL_TRUST_CONTRACT=infra/openclaw/trusted-release-contract.json
      - TRUST_CONTRACT=/opt/teamagent/trusted-release/contracts/teamagent-openclaw-production-v1.json
      - SOURCE_STATEMENT=.trusted-release/source-statement.json
      - EXPECTED_REPOSITORY=718959508629.dkr.ecr.ap-northeast-1.amazonaws.com/teamagent-openclaw
      - test -x "$TRUSTED_RELEASE_CLI" && test ! -L "$TRUSTED_RELEASE_CLI"
      - test -f "$LOCAL_TRUST_CONTRACT" && test ! -L "$LOCAL_TRUST_CONTRACT"
      - test -f "$TRUST_CONTRACT" && test ! -L "$TRUST_CONTRACT"
      - cmp -s "$LOCAL_TRUST_CONTRACT" "$TRUST_CONTRACT"
      - test -f "$SOURCE_STATEMENT" && test ! -L "$SOURCE_STATEMENT"
      - test -n "$CODEBUILD_BUILD_ARN" && test -n "$CODEBUILD_BUILD_ID" && test -n "$CODEBUILD_SOURCE_VERSION"
      - case "$CODEBUILD_BUILD_ARN" in arn:aws:codebuild:ap-northeast-1:718959508629:build/teamagent-dev-openclaw-image-builder:*) ;; *) echo "unexpected CodeBuild identity" >&2; exit 1 ;; esac
      - "$TRUSTED_RELEASE_CLI" verify-source --profile teamagent-openclaw-production-v1 --contract "$TRUST_CONTRACT" --statement "$SOURCE_STATEMENT" --source-root "$CODEBUILD_SRC_DIR" --transport-version "$CODEBUILD_SOURCE_VERSION" --build-arn "$CODEBUILD_BUILD_ARN" --output /tmp/trusted-source.json
      - jq -e '.schemaVersion == 1 and .verified == true and .kmsSignatureVerified == true and .publisherTrusted == true and .commitArchiveExact == true and .transportMetadataTrusted == false and (.source.commit | test("^[0-9a-f]{40}$")) and (.source.archiveSha256 | test("^[0-9a-f]{64}$")) and .source.repositoryUri == "https://github.com/noirelumiere00/teamagent" and (.source.artifactVersion | type == "string" and length > 0)' /tmp/trusted-source.json
      - export SOURCE_COMMIT=$(jq -er '.source.commit' /tmp/trusted-source.json)
      - export SOURCE_BRANCH=$(jq -er '.source.branch' /tmp/trusted-source.json)
      - export SOURCE_ARCHIVE_SHA256=$(jq -er '.source.archiveSha256' /tmp/trusted-source.json)
      - export SOURCE_ARTIFACT_VERSION=$(jq -er '.source.artifactVersion' /tmp/trusted-source.json)
      - export SOURCE_URI=https://github.com/noirelumiere00/teamagent
      - mkdir -p /root/.docker/cli-plugins
      - curl -fsSLo /root/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-arm64
      - echo "204dc28447d3bb48f42ed1ce5747e0885cd57e306506a39029311becdb1ef786  /root/.docker/cli-plugins/docker-buildx" | sha256sum -c -
      - chmod 0755 /root/.docker/cli-plugins/docker-buildx
      - test "$(docker buildx version | awk '{print $2}')" = "v0.33.0"
      - curl -fsSLo /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-ARM64.tar.gz
      - echo "2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467  /tmp/trivy.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - test "$(trivy --version --format json | jq -er '.Version')" = "0.72.0"
  build:
    commands:
      - VALIDATION_IMAGE="openclaw-validation:git-${SOURCE_COMMIT:0:12}-build-${CODEBUILD_BUILD_NUMBER}"
      - bash infra/openclaw/build-image.sh --image "$VALIDATION_IMAGE" --trusted-source "$SOURCE_STATEMENT" --manifest /tmp/openclaw-build-manifest.json --evidence-dir /tmp/openclaw-build-evidence
      - jq -e '.schemaVersion == 4 and .deploymentCredential == false and .promotion.status == "LOCAL_GATES_PASSED" and .promotion.registryPublished == false and .promotion.canonicalTagPublished == false and .runtime.actualImageContractPassed == true and .runtime.controlUiFullAssetClosureValidated == true and .sbom.wholeFilesystemExactMatch == true and .materials.exactSetMatch == true and .scan.critical == 0 and .scan.high == 0 and .scan.secrets == 0 and .scan.exactSingleLinuxArm64Subject == true and .scan.allKnownLiveFindingsAbsent == true and (.scan.knownLiveFindingIdsAbsent | length) == 8' /tmp/openclaw-build-manifest.json
      - "$TRUSTED_RELEASE_CLI" promote-openclaw --profile teamagent-openclaw-production-v1 --contract "$TRUST_CONTRACT" --source-statement "$SOURCE_STATEMENT" --source-root "$CODEBUILD_SRC_DIR" --transport-version "$CODEBUILD_SOURCE_VERSION" --local-image "$VALIDATION_IMAGE" --release-manifest /tmp/openclaw-build-manifest.json --evidence-index /tmp/openclaw-build-evidence/evidence-index.json --expected-repository "$EXPECTED_REPOSITORY" --canonical-tag "git-${SOURCE_COMMIT:0:12}" --build-arn "$CODEBUILD_BUILD_ARN" --output /tmp/trusted-promotion.json
  post_build:
    commands:
      - "$TRUSTED_RELEASE_CLI" verify-promotion --profile teamagent-openclaw-production-v1 --contract "$TRUST_CONTRACT" --promotion /tmp/trusted-promotion.json --release-manifest /tmp/openclaw-build-manifest.json --evidence-index /tmp/openclaw-build-evidence/evidence-index.json --expected-repository "$EXPECTED_REPOSITORY" --expected-commit "$SOURCE_COMMIT"
      - jq -e --arg repository "$EXPECTED_REPOSITORY" --arg commit "$SOURCE_COMMIT" --arg builder "$CODEBUILD_BUILD_ARN" '.schemaVersion == 1 and .verified == true and .kmsSignatureVerified == true and .sourceCommit == $commit and .buildIdentity == $builder and .repository == $repository and .canonicalTag == ("git-" + ($commit[0:12])) and .platform == "linux/arm64" and .platformManifestCount == 1 and .scanStatus.critical == 0 and .scanStatus.high == 0 and .scanStatus.secrets == 0 and (.scanStatus.knownLiveFindingIdsAbsent | length) == 8 and .quarantineValidated == true and .subjectDigestVerified == true and .sourceRootReverified == true and .exactMaterialSetVerified == true and .wholeFilesystemSbomExact == true and .allEvidenceFilesBound == true and .referrerSetExact == true and .canonicalPromotionAtomic == true and .canonicalTagImmutable == true and (.wholeFilesystemSbomDigest | test("^sha256:[0-9a-f]{64}$")) and (.provenanceDigest | test("^sha256:[0-9a-f]{64}$")) and (.imageSignatureDigest | test("^sha256:[0-9a-f]{64}$")) and (.evidenceIndexSignatureDigest | test("^sha256:[0-9a-f]{64}$"))' /tmp/trusted-promotion.json
      - mkdir -p openclaw-release/openclaw-build-evidence
      - cp /tmp/openclaw-build-manifest.json /tmp/openclaw-build-manifest.json.sha256 /tmp/trusted-source.json /tmp/trusted-promotion.json openclaw-release/
      - cp -a /tmp/openclaw-build-evidence/. openclaw-release/openclaw-build-evidence/
      - jq -c . /tmp/trusted-promotion.json

artifacts:
  files:
    - "**/*"
  base-directory: openclaw-release
  name: openclaw-$SOURCE_COMMIT
