# Independent trusted publisher for the MCP S3 source archive.
version: 0.2
env:
  git-credential-helper: yes
  exported-variables:
    - PUBLISHED_SOURCE_VERSION_ID
    - SOURCE_DECLARATION_KEY
    - SOURCE_DECLARATION_VERSION_ID
    - SOURCE_DECLARATION_SHA256
    - SOURCE_DECLARATION_SIGNATURE_KEY
    - SOURCE_DECLARATION_SIGNATURE_VERSION_ID
phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        umask 077
        export AWS_IGNORE_CONFIGURED_ENDPOINT_URLS=true
        unset AWS_ENDPOINT_URL AWS_ENDPOINT_URL_STS AWS_ENDPOINT_URL_S3 AWS_ENDPOINT_URL_KMS AWS_ENDPOINT_URL_ECR
        while IFS= read -r AWS_ENDPOINT_VARIABLE; do
          unset "$AWS_ENDPOINT_VARIABLE"
        done < <(compgen -A variable AWS_ENDPOINT_URL)
        unset AWS_ENDPOINT_VARIABLE
        EXPECTED_ACCOUNT_ID="718959508629"
        EXPECTED_REGION="ap-northeast-1"
        EXPECTED_REPOSITORY="https://github.com/noirelumiere00/TeamAgent.git"
        EXPECTED_HEAD_REF="refs/heads/dev"
        EXPECTED_BASE_REF="refs/heads/main"
        SOURCE_BUCKET="teamagent-dev-raw-files"
        SOURCE_KEY="codebuild/source.zip"
        APP_KEY="codebuild/connect-web-app.html"
        EVIDENCE_BUCKET="teamagent-dev-image-release-evidence"
        SIGNING_KEY_ARN="__SOURCE_PUBLISHER_SIGNING_KEY_ARN__"
        EVIDENCE_KMS_KEY_ARN="__RELEASE_EVIDENCE_KMS_KEY_ARN__"
        export AWS_DEFAULT_REGION="$EXPECTED_REGION" AWS_REGION="$EXPECTED_REGION"
        readonly EXPECTED_ACCOUNT_ID EXPECTED_REGION EXPECTED_REPOSITORY
        readonly SOURCE_BUCKET SOURCE_KEY APP_KEY EVIDENCE_BUCKET
        readonly SIGNING_KEY_ARN EVIDENCE_KMS_KEY_ARN
        [ "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID" ] || { echo "FATAL: wrong AWS account"; exit 1; }
        [ "$CODEBUILD_SOURCE_REPO_URL" = "$EXPECTED_REPOSITORY" ] || { echo "FATAL: wrong source repository"; exit 1; }
        : "${EXPECTED_COMMIT:?EXPECTED_COMMIT is required}"
        : "${EXPECTED_BASE_OID:?EXPECTED_BASE_OID is required}"
        : "${SOURCE_MANIFEST_CONTRACT_SHA256:?SOURCE_MANIFEST_CONTRACT_SHA256 is required}"
        : "${RELEASE_CONTRACT_SHA256:?RELEASE_CONTRACT_SHA256 is required}"
        : "${APPROVAL_PAYLOAD_BUCKET:?APPROVAL_PAYLOAD_BUCKET is required}"
        : "${APPROVAL_PAYLOAD_KEY:?APPROVAL_PAYLOAD_KEY is required}"
        : "${APPROVAL_PAYLOAD_VERSION_ID:?APPROVAL_PAYLOAD_VERSION_ID is required}"
        : "${APPROVAL_PAYLOAD_SHA256:?APPROVAL_PAYLOAD_SHA256 is required}"
        : "${APPROVAL_SIGNATURE_BUCKET:?APPROVAL_SIGNATURE_BUCKET is required}"
        : "${APPROVAL_SIGNATURE_KEY:?APPROVAL_SIGNATURE_KEY is required}"
        : "${APPROVAL_SIGNATURE_VERSION_ID:?APPROVAL_SIGNATURE_VERSION_ID is required}"
        : "${APPROVAL_SIGNATURE_SHA256:?APPROVAL_SIGNATURE_SHA256 is required}"
        : "${APPROVAL_SIGNING_KEY_ARN:?APPROVAL_SIGNING_KEY_ARN is required}"
        [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: expected commit must be a full SHA"; exit 1; }
        [[ "$EXPECTED_BASE_OID" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: expected base must be a full SHA"; exit 1; }
        [[ "$CODEBUILD_SOURCE_VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: source-version must be a full SHA"; exit 1; }
        [ "$CODEBUILD_SOURCE_VERSION" = "$EXPECTED_COMMIT" ] || { echo "FATAL: source-version differs from expected commit"; exit 1; }
        [ "$CODEBUILD_RESOLVED_SOURCE_VERSION" = "$EXPECTED_COMMIT" ] || { echo "FATAL: resolved source commit mismatch"; exit 1; }
        git ls-remote --exit-code --heads "$EXPECTED_REPOSITORY" \
          "$EXPECTED_HEAD_REF" "$EXPECTED_BASE_REF" >/tmp/teamagent-remote-heads
        [ "$(awk -v ref="$EXPECTED_HEAD_REF" '$2 == ref {count++; oid=$1} END {if (count == 1) print oid}' /tmp/teamagent-remote-heads)" = "$EXPECTED_COMMIT" ] \
          || { echo "FATAL: fresh protected remote head differs from expected commit"; exit 1; }
        [ "$(awk -v ref="$EXPECTED_BASE_REF" '$2 == ref {count++; oid=$1} END {if (count == 1) print oid}' /tmp/teamagent-remote-heads)" = "$EXPECTED_BASE_OID" ] \
          || { echo "FATAL: fresh protected remote base differs from expected base"; exit 1; }
        PUBLISHER_REPOSITORY=/tmp/teamagent-publisher-repository
        PUBLISHER_CHECKOUT=/tmp/teamagent-publisher-checkout
        rm -rf -- "$PUBLISHER_REPOSITORY" "$PUBLISHER_CHECKOUT"
        git init --bare --quiet "$PUBLISHER_REPOSITORY"
        git -C "$PUBLISHER_REPOSITORY" fetch --quiet --no-tags "$EXPECTED_REPOSITORY" \
          "$EXPECTED_HEAD_REF:refs/remotes/verified/dev" \
          "$EXPECTED_BASE_REF:refs/remotes/verified/main"
        [ "$(git -C "$PUBLISHER_REPOSITORY" rev-parse refs/remotes/verified/dev^{commit})" = "$EXPECTED_COMMIT" ] \
          || { echo "FATAL: fetched remote head object mismatch"; exit 1; }
        [ "$(git -C "$PUBLISHER_REPOSITORY" rev-parse refs/remotes/verified/main^{commit})" = "$EXPECTED_BASE_OID" ] \
          || { echo "FATAL: fetched remote base object mismatch"; exit 1; }
        git -C "$PUBLISHER_REPOSITORY" worktree add --quiet --detach \
          "$PUBLISHER_CHECKOUT" "$EXPECTED_COMMIT"
        [ "$(git -C "$PUBLISHER_CHECKOUT" rev-parse HEAD^{commit})" = "$EXPECTED_COMMIT" ] \
          || { echo "FATAL: detached publisher checkout mismatch"; exit 1; }
        [ "$(git -C "$PUBLISHER_CHECKOUT" merge-base "$EXPECTED_BASE_OID" "$EXPECTED_COMMIT")" = "$EXPECTED_BASE_OID" ] \
          || { echo "FATAL: protected base is not the reviewed merge-base"; exit 1; }
        [ -z "$(git -C "$PUBLISHER_CHECKOUT" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" ] \
          || { echo "FATAL: detached publisher checkout is dirty"; exit 1; }
        [ "$(aws s3api get-bucket-versioning \
          --region "$EXPECTED_REGION" \
          --bucket "$SOURCE_BUCKET" \
          --expected-bucket-owner "$EXPECTED_ACCOUNT_ID" \
          --query Status \
          --output text)" = "Enabled" ] \
          || { echo "FATAL: source bucket versioning is not enabled"; exit 1; }
        [[ "$SOURCE_MANIFEST_CONTRACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "FATAL: invalid source manifest contract SHA-256"; exit 1; }
        [[ "$RELEASE_CONTRACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "FATAL: invalid release contract SHA-256"; exit 1; }
        [ "$APPROVAL_PAYLOAD_BUCKET" = "$EVIDENCE_BUCKET" ] \
          && [ "$APPROVAL_SIGNATURE_BUCKET" = "$EVIDENCE_BUCKET" ] \
          || { echo "FATAL: approval bucket is not allowlisted"; exit 1; }
        [[ "$APPROVAL_PAYLOAD_KEY" =~ ^approval-records/mcp/$EXPECTED_COMMIT/[0-9a-f]{64}\.json$ ]] \
          || { echo "FATAL: approval payload key does not bind the expected commit"; exit 1; }
        [ "$APPROVAL_SIGNATURE_KEY" = "$APPROVAL_PAYLOAD_KEY.sig" ] \
          || { echo "FATAL: approval signature key mismatch"; exit 1; }
        [ "${APPROVAL_PAYLOAD_KEY%.json}" = \
          "approval-records/mcp/$EXPECTED_COMMIT/$APPROVAL_PAYLOAD_SHA256" ] \
          || { echo "FATAL: approval payload key/hash mismatch"; exit 1; }
        for approval_digest in "$APPROVAL_PAYLOAD_SHA256" "$APPROVAL_SIGNATURE_SHA256"; do
          [[ "$approval_digest" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "FATAL: invalid approval SHA-256"; exit 1; }
        done
        for approval_version in \
          "$APPROVAL_PAYLOAD_VERSION_ID" "$APPROVAL_SIGNATURE_VERSION_ID"; do
          case "$approval_version" in
            ""|None|null|*[!A-Za-z0-9._~+/=-]*)
              echo "FATAL: invalid approval VersionId"
              exit 1
              ;;
          esac
        done
        [[ "$APPROVAL_SIGNING_KEY_ARN" =~ ^arn:aws:kms:ap-northeast-1:718959508629:key/[0-9A-Za-z-]+$ ]] \
          || { echo "FATAL: approval signing key is outside the fixed account"; exit 1; }
        printf '%s' '__SOURCE_PROVENANCE_BASE64__' | base64 --decode > /tmp/source_provenance.py
        printf '%s' '__TEAMAGENT_SCHEMA_VERSIONS_BASE64__' | base64 --decode > /tmp/teamagent_schema_versions.py
        printf '%s' '__TEAMAGENT_RELEASE_APPROVAL_BASE64__' | base64 --decode > /tmp/teamagent_release_approval.py
        printf '%s' '__RELEASE_EVIDENCE_BASE64__' | base64 --decode > /tmp/release_evidence.py
        printf '%s' '__TEAMAGENT_BUNDLE_PROVENANCE_BASE64__' | base64 --decode > /tmp/teamagent_bundle_provenance.py
        printf '%s' '__SOURCE_MANIFEST_CONTRACT_BASE64__' | base64 --decode > /tmp/teamagent_runtime_contract.json
        printf '%s' '__MCP_RELEASE_CONTRACT_BASE64__' | base64 --decode > /tmp/teamagent_core_media_release_contract.json
        [ "$(sha256sum /tmp/teamagent_runtime_contract.json | awk '{print $1}')" = "$SOURCE_MANIFEST_CONTRACT_SHA256" ] || { echo "FATAL: embedded source manifest contract hash mismatch"; exit 1; }
        [ "$(sha256sum /tmp/teamagent_core_media_release_contract.json | awk '{print $1}')" = "$RELEASE_CONTRACT_SHA256" ] || { echo "FATAL: embedded release contract hash mismatch"; exit 1; }
        [ "$(git -C "$PUBLISHER_CHECKOUT" show "$EXPECTED_COMMIT:infra/codebuild/teamagent_runtime_contract.json" | sha256sum | awk '{print $1}')" = "$SOURCE_MANIFEST_CONTRACT_SHA256" ] || { echo "FATAL: source commit manifest contract differs from trusted contract"; exit 1; }
        [ "$(git -C "$PUBLISHER_CHECKOUT" show "$EXPECTED_COMMIT:infra/codebuild/teamagent_core_media_release_contract.json" | sha256sum | awk '{print $1}')" = "$RELEASE_CONTRACT_SHA256" ] || { echo "FATAL: source commit release contract differs from trusted contract"; exit 1; }
        [ "$(git -C "$PUBLISHER_CHECKOUT" show "$EXPECTED_COMMIT:infra/codebuild/teamagent_bundle_provenance.py" | sha256sum | awk '{print $1}')" = "$(sha256sum /tmp/teamagent_bundle_provenance.py | awk '{print $1}')" ] || { echo "FATAL: source commit bundle verifier differs from trusted bytes"; exit 1; }
        python3 /tmp/teamagent_bundle_provenance.py validate-contract-pair \
          --runtime-contract \
            "$PUBLISHER_CHECKOUT/infra/codebuild/teamagent_runtime_contract.json" \
          --contract /tmp/teamagent_core_media_release_contract.json \
          --repo-root "$PUBLISHER_CHECKOUT"
        python3 /tmp/teamagent_bundle_provenance.py assert-contract-ready \
          --contract /tmp/teamagent_core_media_release_contract.json
        EXPECTED_TREE_OID="$(
          git -C "$PUBLISHER_CHECKOUT" rev-parse "$EXPECTED_COMMIT^{tree}"
        )"
        [[ "$EXPECTED_TREE_OID" =~ ^[0-9a-f]{40}$ ]] \
          || { echo "FATAL: expected source tree is invalid"; exit 1; }
        APPROVAL_LOCATORS_JSON="$(
          jq -cn \
            --arg payload_bucket "$APPROVAL_PAYLOAD_BUCKET" \
            --arg payload_key "$APPROVAL_PAYLOAD_KEY" \
            --arg payload_version_id "$APPROVAL_PAYLOAD_VERSION_ID" \
            --arg payload_sha256 "$APPROVAL_PAYLOAD_SHA256" \
            --arg signature_bucket "$APPROVAL_SIGNATURE_BUCKET" \
            --arg signature_key "$APPROVAL_SIGNATURE_KEY" \
            --arg signature_version_id "$APPROVAL_SIGNATURE_VERSION_ID" \
            --arg signature_sha256 "$APPROVAL_SIGNATURE_SHA256" '{
              mcp: {
                payload: {
                  bucket: $payload_bucket,
                  key: $payload_key,
                  version_id: $payload_version_id,
                  sha256: $payload_sha256
                },
                signature: {
                  bucket: $signature_bucket,
                  key: $signature_key,
                  version_id: $signature_version_id,
                  sha256: $signature_sha256
                }
              }
            }'
        )"
        APPROVAL_EVIDENCE_JSON="$(
          python3 /tmp/release_evidence.py assert-approved-release \
            --operation build \
            --approval-locators-json "$APPROVAL_LOCATORS_JSON" \
            --approval-signing-key-arn "$APPROVAL_SIGNING_KEY_ARN" \
            --approval-encryption-key-arn "$EVIDENCE_KMS_KEY_ARN" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-tree-oid "$EXPECTED_TREE_OID" \
            --expected-inner-sha256 "$SOURCE_MANIFEST_CONTRACT_SHA256" \
            --expected-outer-sha256 "$RELEASE_CONTRACT_SHA256" \
            --expected-pipeline mcp \
            --expected-environment dev \
            --runtime-contract /tmp/teamagent_runtime_contract.json \
            --contract /tmp/teamagent_core_media_release_contract.json
        )"
        jq -e 'type == "object"' <<<"$APPROVAL_EVIDENCE_JSON" >/dev/null \
          || { echo "FATAL: approval verifier returned invalid evidence"; exit 1; }
        export APPROVAL_EVIDENCE_JSON
        mapfile -t PRODUCTION_APP_RECORD < <(
          python3 /tmp/teamagent_bundle_provenance.py production-record \
            --deploy-log "$PUBLISHER_CHECKOUT/infra/deploy_log.md" \
            --format lines
        )
        [ "${#PRODUCTION_APP_RECORD[@]}" -eq 4 ] || { echo "FATAL: latest production app record is incomplete"; exit 1; }
        APP_HTML_VERSION_ID="${PRODUCTION_APP_RECORD[0]}"
        APP_HTML_SHA256="${PRODUCTION_APP_RECORD[1]}"
        VAULT_MANIFEST_SHA256="${PRODUCTION_APP_RECORD[2]}"
        BUILD_INPUTS_SHA256="${PRODUCTION_APP_RECORD[3]}"
        BAKED_APP_HTML_VERSION_ID="$(jq -er '.app_html.baked_fallback.s3_version_id' /tmp/teamagent_core_media_release_contract.json)"
        BAKED_APP_HTML_SHA256="$(jq -er '.app_html.baked_fallback.sha256' /tmp/teamagent_core_media_release_contract.json)"
        BAKED_APP_HTML_KEY="$(jq -er '.app_html.baked_fallback.key' /tmp/teamagent_core_media_release_contract.json)"
        [ "$BAKED_APP_HTML_KEY" = "codebuild/baked-fallback/connect-web-app.html" ] \
          || { echo "FATAL: baked fallback key differs from the fixed release location"; exit 1; }
        APP_PROVENANCE_SHA256="$(
          python3 /tmp/teamagent_bundle_provenance.py app-provenance-sha256 \
            --contract /tmp/teamagent_core_media_release_contract.json \
            --deploy-log "$PUBLISHER_CHECKOUT/infra/deploy_log.md"
        )"
        readonly APP_HTML_VERSION_ID APP_HTML_SHA256 VAULT_MANIFEST_SHA256 BUILD_INPUTS_SHA256
        readonly BAKED_APP_HTML_KEY BAKED_APP_HTML_VERSION_ID BAKED_APP_HTML_SHA256 APP_PROVENANCE_SHA256
  build:
    commands:
      - |
        set -euo pipefail
        umask 077
        export AWS_IGNORE_CONFIGURED_ENDPOINT_URLS=true
        unset AWS_ENDPOINT_URL AWS_ENDPOINT_URL_STS AWS_ENDPOINT_URL_S3 AWS_ENDPOINT_URL_KMS AWS_ENDPOINT_URL_ECR
        while IFS= read -r AWS_ENDPOINT_VARIABLE; do
          unset "$AWS_ENDPOINT_VARIABLE"
        done < <(compgen -A variable AWS_ENDPOINT_URL)
        unset AWS_ENDPOINT_VARIABLE
        export AWS_DEFAULT_REGION="ap-northeast-1" AWS_REGION="ap-northeast-1"
        TMP_DIR="$(mktemp -d /tmp/teamagent-source-publisher.XXXXXXXX)"
        trap 'rm -rf -- "$TMP_DIR"' EXIT
        MANIFEST="$TMP_DIR/.teamagent-source-manifest.json"
        SOURCE_ZIP="$TMP_DIR/source.zip"
        PRODUCTION_APP_HTML="$TMP_DIR/production-connect-web-app.html"
        BAKED_APP_HTML="$TMP_DIR/baked-connect-web-app.html"
        PUBLISHER_CHECKOUT=/tmp/teamagent-publisher-checkout
        DOWNLOADED_APP_VERSION="$(
          aws s3api get-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-raw-files \
            --key codebuild/connect-web-app.html \
            --version-id "$APP_HTML_VERSION_ID" \
            --expected-bucket-owner 718959508629 \
            --query VersionId \
            --output text \
            "$PRODUCTION_APP_HTML"
        )"
        [ "$DOWNLOADED_APP_VERSION" = "$APP_HTML_VERSION_ID" ] || { echo "FATAL: app HTML VersionId mismatch"; exit 1; }
        [ "$(sha256sum "$PRODUCTION_APP_HTML" | awk '{print $1}')" = "$APP_HTML_SHA256" ] || { echo "FATAL: app HTML hash mismatch"; exit 1; }
        DOWNLOADED_FALLBACK_VERSION="$(
          aws s3api get-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-raw-files \
            --key "$BAKED_APP_HTML_KEY" \
            --version-id "$BAKED_APP_HTML_VERSION_ID" \
            --expected-bucket-owner 718959508629 \
            --query VersionId \
            --output text \
            "$BAKED_APP_HTML"
        )"
        [ "$DOWNLOADED_FALLBACK_VERSION" = "$BAKED_APP_HTML_VERSION_ID" ] || { echo "FATAL: baked fallback VersionId mismatch"; exit 1; }
        [ "$(sha256sum "$BAKED_APP_HTML" | awk '{print $1}')" = "$BAKED_APP_HTML_SHA256" ] || { echo "FATAL: baked fallback hash mismatch"; exit 1; }
        [ "$APP_HTML_SHA256" != "$BAKED_APP_HTML_SHA256" ] || { echo "FATAL: live app cannot replace the baked fallback"; exit 1; }
        python3 /tmp/source_provenance.py create-manifest \
          --repo-root "$PUBLISHER_CHECKOUT" \
          --commit "$EXPECTED_COMMIT" \
          --branch dev \
          --with-scrape-tools true \
          --app-html-version-id "$APP_HTML_VERSION_ID" \
          --app-html-sha256 "$APP_HTML_SHA256" \
          --output "$MANIFEST"
        MANIFEST_SHA256="$(sha256sum "$MANIFEST" | awk '{print $1}')"
        git -C "$PUBLISHER_CHECKOUT" archive \
          --format=zip \
          --output="$SOURCE_ZIP" \
          "$EXPECTED_COMMIT"
        python3 - "$SOURCE_ZIP" "$MANIFEST" <<'PY'
        import sys
        import zipfile

        archive, manifest = sys.argv[1:]
        additions = {
            ".teamagent-source-manifest.json": manifest,
        }
        with zipfile.ZipFile(archive, "a", compression=zipfile.ZIP_DEFLATED) as output:
            existing = set(output.namelist())
            conflicts = sorted(existing & additions.keys())
            if conflicts:
                raise SystemExit(f"FATAL: source archive path collision: {conflicts}")
            for name, path in additions.items():
                output.write(path, arcname=name)
        PY
        SOURCE_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
        EXTRACTED="$TMP_DIR/extracted"
        mkdir -p "$EXTRACTED"
        python3 -m zipfile -e "$SOURCE_ZIP" "$EXTRACTED"
        python3 - "$EXTRACTED" "$EXTRACTED/.teamagent-source-manifest.json" <<'PY'
        import json
        import os
        import stat
        import sys
        from pathlib import Path

        root = Path(sys.argv[1]).resolve()
        manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
        executable = set(manifest["archive"]["executable_paths"])
        for path in sorted(root.rglob("*")):
            relative = path.relative_to(root).as_posix()
            mode = path.lstat().st_mode
            if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                raise SystemExit(f"FATAL: unsupported extracted source entry: {relative}")
            if stat.S_ISDIR(mode):
                path.chmod(0o755)
            else:
                path.chmod(0o755 if relative in executable else 0o644)
        PY
        python3 /tmp/source_provenance.py verify-source \
          --source-root "$EXTRACTED" \
          --manifest "$EXTRACTED/.teamagent-source-manifest.json" \
          --expected-commit "$EXPECTED_COMMIT" \
          --expected-branch dev \
          --expected-with-scrape-tools true \
          --expected-app-html-version-id "$APP_HTML_VERSION_ID" \
          --expected-app-html-sha256 "$APP_HTML_SHA256" \
          --expected-runtime-contract-sha256 "$SOURCE_MANIFEST_CONTRACT_SHA256"
        python3 /tmp/teamagent_bundle_provenance.py verify-source-interface \
          --repo-root "$EXTRACTED" \
          --contract "$EXTRACTED/infra/codebuild/teamagent_core_media_release_contract.json" \
          --deploy-log "$EXTRACTED/infra/deploy_log.md" \
          --baked-fallback "$BAKED_APP_HTML"
        mkdir -p "$EXTRACTED/src/teamagent/connect_web/static"
        install -m 0644 "$BAKED_APP_HTML" \
          "$EXTRACTED/src/teamagent/connect_web/static/app.html"
        BUILD_CONTEXT_TAR="$TMP_DIR/canonical-build-context.tar"
        BUILD_CONTEXT_SHA256="$(
          python3 "$EXTRACTED/infra/docker/canonical_build_context.py" \
            "$EXTRACTED" \
            "$BUILD_CONTEXT_TAR"
        )"
        [ "$(sha256sum "$BUILD_CONTEXT_TAR" | awk '{print $1}')" = "$BUILD_CONTEXT_SHA256" ] \
          || { echo "FATAL: publisher canonical context digest mismatch"; exit 1; }
        [ "$(
          python3 "$EXTRACTED/infra/docker/canonical_build_context.py" \
            verify "$BUILD_CONTEXT_TAR" --no-symlinks
        )" = "$BUILD_CONTEXT_SHA256" ] \
          || { echo "FATAL: publisher canonical context contract mismatch"; exit 1; }
        SOURCE_TREE_OID="$(
          git -C "$PUBLISHER_CHECKOUT" rev-parse "$EXPECTED_COMMIT^{tree}"
        )"
        MERGE_BASE_OID="$(
          git -C "$PUBLISHER_CHECKOUT" merge-base "$EXPECTED_BASE_OID" "$EXPECTED_COMMIT"
        )"
        [ "$MERGE_BASE_OID" = "$EXPECTED_BASE_OID" ] \
          || { echo "FATAL: publisher merge-base changed"; exit 1; }
        [ "$(git -C "$PUBLISHER_CHECKOUT" rev-parse --verify HEAD^{commit})" = "$EXPECTED_COMMIT" ] || { echo "FATAL: checkout changed during archive creation"; exit 1; }
        [ -z "$(git -C "$PUBLISHER_CHECKOUT" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" ] || { echo "FATAL: checkout changed during archive creation"; exit 1; }
        PUBLISHED_SOURCE_VERSION_ID="$(
          aws s3api put-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-raw-files \
            --key codebuild/source.zip \
            --body "$SOURCE_ZIP" \
            --expected-bucket-owner 718959508629 \
            --content-type application/zip \
            --server-side-encryption AES256 \
            --query VersionId \
            --output text
        )"
        case "$PUBLISHED_SOURCE_VERSION_ID" in ""|None|null|*[!A-Za-z0-9._~+/=-]*) echo "FATAL: source archive VersionId is invalid"; exit 1 ;; esac
        BUILD_CONTEXT_KEY="source-contexts/mcp/$EXPECTED_COMMIT/$BUILD_CONTEXT_SHA256/$CODEBUILD_BUILD_ID.tar"
        BUILD_CONTEXT_RETAIN_UNTIL="$(
          date -u -d '+3650 days' '+%Y-%m-%dT%H:%M:%SZ'
        )"
        BUILD_CONTEXT_VERSION_ID="$(
          aws s3api put-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-image-release-evidence \
            --key "$BUILD_CONTEXT_KEY" \
            --body "$BUILD_CONTEXT_TAR" \
            --expected-bucket-owner 718959508629 \
            --content-type application/x-tar \
            --server-side-encryption aws:kms \
            --ssekms-key-id "__RELEASE_EVIDENCE_KMS_KEY_ARN__" \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$BUILD_CONTEXT_RETAIN_UNTIL" \
            --if-none-match '*' \
            --query VersionId \
            --output text
        )"
        case "$BUILD_CONTEXT_VERSION_ID" in
          ""|None|null|*[!A-Za-z0-9._~+/=-]*)
            echo "FATAL: canonical context VersionId is invalid"
            exit 1
            ;;
        esac
        PUBLISHER_PROJECT_ARN="arn:aws:codebuild:ap-northeast-1:718959508629:project/teamagent-dev-mcp-source-publisher"
        python3 /tmp/release_evidence.py create-source-declaration \
          --project-arn "$PUBLISHER_PROJECT_ARN" \
          --build-id "$CODEBUILD_BUILD_ID" \
          --commit "$EXPECTED_COMMIT" \
          --source-version "$PUBLISHED_SOURCE_VERSION_ID" \
          --source-sha256 "$SOURCE_SHA256" \
          --manifest-sha256 "$MANIFEST_SHA256" \
          --build-context-key "$BUILD_CONTEXT_KEY" \
          --build-context-version "$BUILD_CONTEXT_VERSION_ID" \
          --build-context-sha256 "$BUILD_CONTEXT_SHA256" \
          --source-tree-oid "$SOURCE_TREE_OID" \
          --remote-head-oid "$EXPECTED_COMMIT" \
          --remote-base-oid "$EXPECTED_BASE_OID" \
          --merge-base-oid "$MERGE_BASE_OID" \
          --app-version "$APP_HTML_VERSION_ID" \
          --app-sha256 "$APP_HTML_SHA256" \
          --vault-manifest-sha256 "$VAULT_MANIFEST_SHA256" \
          --build-inputs-sha256 "$BUILD_INPUTS_SHA256" \
          --contract-sha256 "$RELEASE_CONTRACT_SHA256" \
          --approval-evidence-json "$APPROVAL_EVIDENCE_JSON" \
          --output "$TMP_DIR/source-declaration.json"
        SOURCE_DECLARATION_SHA256="$(sha256sum "$TMP_DIR/source-declaration.json" | awk '{print $1}')"
        SOURCE_DECLARATION_KEY="source-declarations/mcp/$EXPECTED_COMMIT/$SOURCE_SHA256/$PUBLISHED_SOURCE_VERSION_ID.json"
        SOURCE_DECLARATION_SIGNATURE_KEY="$SOURCE_DECLARATION_KEY.sig"
        python3 - "$TMP_DIR/source-declaration.json" "$TMP_DIR/source-declaration.sha256" <<'PY'
        import hashlib
        import sys
        with open(sys.argv[1], "rb") as source:
            digest = hashlib.sha256(source.read()).digest()
        with open(sys.argv[2], "wb") as output:
            output.write(digest)
        PY
        aws kms sign \
          --region ap-northeast-1 \
          --key-id "__SOURCE_PUBLISHER_SIGNING_KEY_ARN__" \
          --message-type DIGEST \
          --message "fileb://$TMP_DIR/source-declaration.sha256" \
          --signing-algorithm RSASSA_PSS_SHA_256 \
          --query Signature \
          --output text | base64 --decode >"$TMP_DIR/source-declaration.sig"
        RETAIN_UNTIL="$(date -u -d '+3650 days' '+%Y-%m-%dT%H:%M:%SZ')"
        SOURCE_DECLARATION_VERSION_ID="$(
          aws s3api put-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-image-release-evidence \
            --key "$SOURCE_DECLARATION_KEY" \
            --body "$TMP_DIR/source-declaration.json" \
            --expected-bucket-owner 718959508629 \
            --content-type application/json \
            --server-side-encryption aws:kms \
            --ssekms-key-id "__RELEASE_EVIDENCE_KMS_KEY_ARN__" \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$RETAIN_UNTIL" \
            --if-none-match '*' \
            --query VersionId \
            --output text
        )"
        SOURCE_DECLARATION_SIGNATURE_VERSION_ID="$(
          aws s3api put-object \
            --region ap-northeast-1 \
            --bucket teamagent-dev-image-release-evidence \
            --key "$SOURCE_DECLARATION_SIGNATURE_KEY" \
            --body "$TMP_DIR/source-declaration.sig" \
            --expected-bucket-owner 718959508629 \
            --content-type application/octet-stream \
            --server-side-encryption aws:kms \
            --ssekms-key-id "__RELEASE_EVIDENCE_KMS_KEY_ARN__" \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$RETAIN_UNTIL" \
            --if-none-match '*' \
            --query VersionId \
            --output text
        )"
        case "$SOURCE_DECLARATION_VERSION_ID:$SOURCE_DECLARATION_SIGNATURE_VERSION_ID" in *None*|*null*|:*) echo "FATAL: source declaration VersionId is missing"; exit 1 ;; esac
        export PUBLISHED_SOURCE_VERSION_ID SOURCE_DECLARATION_KEY
        export SOURCE_DECLARATION_VERSION_ID SOURCE_DECLARATION_SHA256
        export SOURCE_DECLARATION_SIGNATURE_KEY SOURCE_DECLARATION_SIGNATURE_VERSION_ID
  post_build:
    commands:
      - |
        set -euo pipefail
        [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" = "1" ] || { echo "FATAL: independent source publication failed"; exit 1; }
        echo "Signed immutable source declaration published for commit=$EXPECTED_COMMIT"
