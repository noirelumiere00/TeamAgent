# CodeBuild buildspec（teamagent-mcp イメージ）。
# codebuild.tf のインライン buildspec を git 管理下に出したもの＋機密 app.html の S3 注入。
# 使い方: aws codebuild start-build --buildspec-override infra/codebuild/buildspec.yml
#
# 【なぜ S3 注入か】connect-web の /app 用 app.html は機密（BANT/営業FB/カルテ埋め込み）で
#   git 管理外（.gitignore）。git 由来のどのビルドでも /app が実 UI を出せるよう、ビルド時に
#   private S3(codebuild/ プレフィックス=既存 CodeBuild ロールの s3:GetObject 範囲・新規IAM不要)
#   から取得してビルドコンテキストへ置く。→ どのイメージにも /app が焼き込まれる。
#
# 【堅牢性(H3)】S3 優先で取得。S3 に無ければ source.zip 同梱の app.html を使う（統合デプロイ
#   スクリプトは zip に手元 html を含める belt-and-suspenders）。S3 にも zip にも無い時だけ
#   fail-loud（exit 1）。無言で「準備中」プレースホルダに劣化させない。
version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - mkdir -p src/teamagent/connect_web/static
      - |
        if aws s3 cp s3://teamagent-dev-raw-files/codebuild/connect-web-app.html src/teamagent/connect_web/static/app.html; then
          echo "app.html <- S3 ($(du -h src/teamagent/connect_web/static/app.html | cut -f1))"
        elif [ -s src/teamagent/connect_web/static/app.html ]; then
          echo "S3 miss -> source.zip 同梱の app.html を使用 ($(du -h src/teamagent/connect_web/static/app.html | cut -f1))"
        else
          echo "FATAL: app.html が S3 にも source にも無い（S3へ配置するか統合スクリプトでzip同梱せよ）"; exit 1
        fi
      - echo "Building teamagent-mcp ($IMAGE_TAG) on $(uname -m)"
      - docker build -f infra/docker/Dockerfile.teamagent-mcp --build-arg WITH_SCRAPE_TOOLS=$WITH_SCRAPE_TOOLS --build-arg GIT_COMMIT="$GIT_COMMIT" --build-arg GIT_BRANCH="$GIT_BRANCH" -t $MCP_REPO:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $MCP_REPO:$IMAGE_TAG
      - aws ecr describe-images --repository-name teamagent-mcp --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageDigest' --output text | tee /tmp/digest.txt
      - echo "MCP_DIGEST=$(cat /tmp/digest.txt)"
