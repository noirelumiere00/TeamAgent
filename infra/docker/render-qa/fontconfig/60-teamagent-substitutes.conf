<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <!-- 和文ゴシックは Noto の palt を焼いた TA Palt Gothic、明朝は Noto Serif CJK JP。表に無い和文が中国語の字形（Noto CJK SC）に落ちないよう、既定のゴシック・明朝も日本語の face を先にする（10-14 CI で ＭＳ Ｐゴシックが NotoSansCJKsc に落ちた）。 -->
 <alias binding="strong"><family>Yu Gothic UI</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Yu Gothic</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>游ゴシック</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>游ゴシック体</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ＭＳ Ｐゴシック</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>MS PGothic</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ＭＳ ゴシック</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>MS Gothic</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>メイリオ</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Meiryo</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Meiryo UI</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Hiragino Sans</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ヒラギノ角ゴ ProN</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ヒラギノ角ゴシック</family><prefer><family>TA Palt Gothic</family><family>Noto Sans CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ＭＳ Ｐ明朝</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>MS PMincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ＭＳ 明朝</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>MS Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>游明朝</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Yu Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>ヒラギノ明朝 ProN</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
 <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
 <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
 <alias><family>TA Palt Gothic</family><default><family>Noto Sans CJK JP</family></default></alias>
 <alias><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
 <alias><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
</fontconfig>
